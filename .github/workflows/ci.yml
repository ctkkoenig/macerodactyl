name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format lint
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift-format lint (strict)
        run: |
          swift format lint --strict --recursive --configuration .swift-format \
            App MacerodactylKit/Sources MacerodactylKit/Tests

  test:
    name: Unit tests + app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift & Xcode versions
        run: swift --version && xcodebuild -version
      - name: Run MacerodactylKit test suite
        working-directory: MacerodactylKit
        run: swift test
      - name: Build the macOS app (ad-hoc signed)
        run: |
          xcodebuild -project Macerodactyl.xcodeproj -scheme Macerodactyl \
            -configuration Debug -derivedDataPath .ci-dd \
            build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO | \
            grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          test -d .ci-dd/Build/Products/Debug/Macerodactyl.app

  # NOTE: real-Docker end-to-end integration is NOT possible on GitHub-hosted
  # macOS runners — they are themselves VMs and forbid nested virtualization, so
  # colima/Docker Desktop cannot start a VM (empirically confirmed: "error
  # starting vm"). Ubuntu runners have Docker natively, but the panel core does
  # not yet build on Linux. The integration job is added on a Linux runner in
  # Tier 4, once `macerodactyld` + the Kit core build headless on Linux; it will
  # run the daemon against real dockerd and curl the panel end-to-end.
