name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format lint
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift-format lint (strict)
        run: |
          swift format lint --strict --recursive --configuration .swift-format \
            App MacerodactylKit/Sources MacerodactylKit/Tests

  test:
    name: Unit tests + app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift & Xcode versions
        run: swift --version && xcodebuild -version
      - name: Run MacerodactylKit test suite
        working-directory: MacerodactylKit
        run: swift test
      - name: Build the macOS app (ad-hoc signed)
        run: |
          xcodebuild -project Macerodactyl.xcodeproj -scheme Macerodactyl \
            -configuration Debug -derivedDataPath .ci-dd \
            build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO | \
            grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          test -d .ci-dd/Build/Products/Debug/Macerodactyl.app

  linux-server:
    name: Linux server build + serve (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the headless server the same way the Dockerfile does — proves the
      # Kit + Panel core compile on Linux (the SwiftUI app/UI target is excluded).
      - name: Build macerodactyld (Linux, swift:6.1 container)
        run: |
          docker run --rm -v "$PWD/MacerodactylKit":/src -w /src swift:6.1 bash -euxc '
            apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
            # --static-swift-stdlib avoids the Linux libswiftObservation → threading::fatal
            # dynamic-link failure (same flag the Dockerfile uses).
            swift build -c release --static-swift-stdlib --product macerodactyld
            swift build -c release --static-swift-stdlib --product kitcheck
          '
      # Real-Docker end-to-end: ubuntu runners have dockerd natively (no nested
      # virt needed, unlike macOS runners), so build the image and confirm the
      # panel actually serves /healthz against the real daemon.
      - name: Build the panel image
        run: docker build -t macerodactyl-panel:ci .
      - name: Run the panel and curl /healthz
        run: |
          docker run -d --name mac-ci -p 27180:27180 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/root macerodactyl-panel:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:27180/healthz; then echo "  <- panel is up"; ok=1; break; fi
            sleep 1
          done
          docker logs mac-ci || true
          docker rm -f mac-ci
          test -n "$ok"
