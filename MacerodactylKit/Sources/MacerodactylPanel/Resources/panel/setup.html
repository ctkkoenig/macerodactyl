<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up · Macerodactyl</title>
<link rel="stylesheet" href="/assets/login.css">
</head><body>
<div class="wrap">
  <h1>Macerodactyl</h1>
  <p class="sub">Create the first administrator account to finish setup.</p>
  <div class="card">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocomplete="username" autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="new-password">
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button id="go">Create admin &amp; sign in</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script src="/assets/setup.js"></script>
</body></html>
