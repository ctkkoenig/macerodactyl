<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Macerodactyl</title>
<link rel="stylesheet" href="/assets/login.css">
</head><body>
<div class="wrap">
  <h1>Macerodactyl</h1>
  <p class="sub">Sign in to the control panel.</p>
  <div class="card">
    <label for="u">Username</label>
    <input id="u" autocapitalize="none" autocomplete="username" autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <div id="totpRow" hidden>
      <label for="t">Authentication code</label>
      <input id="t" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code">
    </div>
    <button id="go">Sign in</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script src="/assets/login.js"></script>
</body></html>
